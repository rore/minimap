name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:ui
      - run: npm run sync-mirrors
      - run: git diff --exit-code -- package/minimap/skills/minimap-roadmap/runtime package/minimap/skills/minimap-spec-review/runtime